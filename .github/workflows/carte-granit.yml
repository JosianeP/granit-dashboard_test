name: Carte - Granit (limites municipales)

on:
  workflow_dispatch:

# Aucun droit par défaut; le job ci-dessous reçoit seulement l'écriture du contenu du dépôt.
permissions: {}

concurrency:
  group: donnees-granit
  cancel-in-progress: false

jobs:
  extraire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Limites des 19 municipalités
        continue-on-error: true
        run: python tools/carte_granit.py --out data/carte
      - name: Vérifier les fichiers produits
        run: |
          python - <<'PY'
          import json, pathlib, sys
          mauvais = []
          for d in ['data/carte']:
              for f in pathlib.Path(d).rglob("*.json"):
                  try:
                      t = f.read_text(encoding="utf-8")
                      json.loads(t)
                      if "<script" in t.lower():
                          mauvais.append("%s : balise script" % f)
                  except Exception as e:
                      mauvais.append("%s : %s" % (f, e))
          if mauvais:
              print("\n".join(mauvais)); sys.exit(1)
          print("Fichiers JSON valides.")
          PY
      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carte
          git diff --cached --quiet || git commit -m "Carte : limites municipales de la MRC du Granit ($(date +%F))"
          git pull --rebase
          git push
