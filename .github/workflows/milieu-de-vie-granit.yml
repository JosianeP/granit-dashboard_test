name: Milieu de vie - Granit (services de garde, logements)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 6 1,4,7,10 *"   # le 6 janvier, avril, juillet et octobre (quatre fois par an)

# Aucun droit par défaut; le job ci-dessous reçoit seulement l'écriture du contenu du dépôt.
permissions: {}

concurrency:
  group: donnees-granit
  cancel-in-progress: false

jobs:
  extraire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Services de garde (ministère de la Famille, Données Québec)
        continue-on-error: true
        run: python tools/garde_granit.py --out data/garde
      - name: Parc de logements (Recensement 2021, Statistique Canada)
        continue-on-error: true
        run: python tools/recensement_granit.py --out data/logement
      - name: Emploi par industrie (Recensement 2021, Statistique Canada)
        continue-on-error: true
        run: python tools/emploi_granit.py --out data/emploi
      - name: Vérifier les fichiers produits
        run: |
          python - <<'PY'
          import json, pathlib, sys
          mauvais = []
          for d in ['data/emploi', 'data/garde', 'data/logement']:
              for f in pathlib.Path(d).rglob("*.json"):
                  try:
                      t = f.read_text(encoding="utf-8")
                      json.loads(t)
                      if "<script" in t.lower():
                          mauvais.append("%s : balise script" % f)
                  except Exception as e:
                      mauvais.append("%s : %s" % (f, e))
          if mauvais:
              print("\n".join(mauvais)); sys.exit(1)
          print("Fichiers JSON valides.")
          PY
      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garde data/logement data/emploi
          git diff --cached --quiet || git commit -m "Milieu de vie : extraction du $(date +%F) pour la MRC du Granit"
          git pull --rebase
          git push
